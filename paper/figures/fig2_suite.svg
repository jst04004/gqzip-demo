<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <rect width="1000" height="480" fill="#ffffff"/>

  <!-- Title -->
  <text x="500" y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#0f172a">
    Figure 2: Empirical Biological Validation &amp; Computational Scalability Suite
  </text>

  <!-- PANEL A: Variant Calling F1 Concordance -->
  <g transform="translate(60, 65)">
    <rect width="410" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
    <text x="15" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e293b">A. Downstream Variant Calling F1 Concordance</text>

    <!-- Y Grid: 0.980 to 1.000 (Height 240) -->
    <g transform="translate(60, 45)">
      <line x1="0" y1="240" x2="330" y2="240" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="180" x2="330" y2="180" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="120" x2="330" y2="120" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="60" x2="330" y2="60" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="0" x2="330" y2="0" stroke="#e2e8f0" stroke-width="1"/>

      <text x="-10" y="244" font-family="sans-serif" font-size="10" text-anchor="end" fill="#64748b">0.980</text>
      <text x="-10" y="184" font-family="sans-serif" font-size="10" text-anchor="end" fill="#64748b">0.985</text>
      <text x="-10" y="124" font-family="sans-serif" font-size="10" text-anchor="end" fill="#64748b">0.990</text>
      <text x="-10" y="64" font-family="sans-serif" font-size="10" text-anchor="end" fill="#64748b">0.995</text>
      <text x="-10" y="4" font-family="sans-serif" font-size="10" text-anchor="end" fill="#64748b">1.000</text>

      <!-- X Grid -->
      <line x1="50" y1="0" x2="50" y2="240" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="170" y1="0" x2="170" y2="240" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="290" y1="0" x2="290" y2="240" stroke="#e2e8f0" stroke-width="1"/>

      <text x="50" y="258" font-family="sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">15x</text>
      <text x="170" y="258" font-family="sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">30x (Clinical)</text>
      <text x="290" y="258" font-family="sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">60x (Deep)</text>

      <!-- Curves -->
      <!-- Lossless F1 = 1.000 -->
      <line x1="50" y1="0" x2="290" y2="0" stroke="#059669" stroke-width="3"/>
      <circle cx="50" cy="0" r="4.5" fill="#059669"/>
      <circle cx="170" cy="0" r="4.5" fill="#059669"/>
      <circle cx="290" cy="0" r="4.5" fill="#059669"/>

      <!-- GQZip SNVs -->
      <path d="M 50 24 L 170 6 L 290 0" fill="none" stroke="#2563eb" stroke-width="2.5"/>
      <rect x="46" y="20" width="8" height="8" fill="#2563eb"/>
      <rect x="166" y="2" width="8" height="8" fill="#2563eb"/>
      <rect x="286" y="-4" width="8" height="8" fill="#2563eb"/>

      <!-- GQZip Indels -->
      <path d="M 50 106 L 170 18 L 290 0" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="50,102 54,110 46,110" fill="#2563eb"/>
      <polygon points="170,14 174,22 166,22" fill="#2563eb"/>
      <polygon points="290,-4 294,4 286,4" fill="#2563eb"/>

      <!-- Illumina 8-bin Indels -->
      <path d="M 50 180 L 170 72 L 290 24" fill="none" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3,3"/>
      <polygon points="50,176 54,180 50,184 46,180" fill="#94a3b8"/>
      <polygon points="170,68 174,72 170,76 166,72" fill="#94a3b8"/>
      <polygon points="290,20 294,24 290,28 286,24" fill="#94a3b8"/>

      <!-- Legend inside Box -->
      <g transform="translate(140, 160)">
        <rect width="185" height="72" rx="4" fill="#ffffff" fill-opacity="0.92" stroke="#cbd5e1"/>
        <line x1="10" y1="15" x2="30" y2="15" stroke="#059669" stroke-width="2.5"/>
        <text x="36" y="19" font-family="sans-serif" font-size="9.5" font-weight="700" fill="#065f46">GQZip Lossless (1.000)</text>

        <line x1="10" y1="32" x2="30" y2="32" stroke="#2563eb" stroke-width="2"/>
        <text x="36" y="36" font-family="sans-serif" font-size="9.5" fill="#1e3a8a">GQZip Adaptive SNVs</text>

        <line x1="10" y1="49" x2="30" y2="49" stroke="#2563eb" stroke-width="2" stroke-dasharray="4,3"/>
        <text x="36" y="53" font-family="sans-serif" font-size="9.5" fill="#1e3a8a">GQZip Adaptive Indels</text>

        <line x1="10" y1="64" x2="30" y2="64" stroke="#94a3b8" stroke-width="1.8" stroke-dasharray="3,3"/>
        <text x="36" y="67" font-family="sans-serif" font-size="9" fill="#64748b">Illumina 8-bin (Artifacts)</text>
      </g>
    </g>
  </g>

  <!-- PANEL B: Peak RAM Footprint (Log Scale) -->
  <g transform="translate(530, 65)">
    <rect width="410" height="340" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" rx="6"/>
    <text x="15" y="25" font-family="sans-serif" font-size="13" font-weight="700" fill="#1e293b">B. Peak Memory Footprint (Log Scale)</text>

    <!-- Y Grid: 10 MB to 64 GB Log Scale (Height 240) -->
    <g transform="translate(60, 45)">
      <line x1="0" y1="240" x2="330" y2="240" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="180" x2="330" y2="180" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="120" x2="330" y2="120" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="60" x2="330" y2="60" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="0" y1="0" x2="330" y2="0" stroke="#e2e8f0" stroke-width="1"/>

      <text x="-10" y="244" font-family="sans-serif" font-size="10" text-anchor="end" fill="#64748b">10 MB</text>
      <text x="-10" y="184" font-family="sans-serif" font-size="10" text-anchor="end" fill="#64748b">100 MB</text>
      <text x="-10" y="124" font-family="sans-serif" font-size="10" text-anchor="end" fill="#64748b">1 GB</text>
      <text x="-10" y="64" font-family="sans-serif" font-size="10" text-anchor="end" fill="#64748b">10 GB</text>
      <text x="-10" y="4" font-family="sans-serif" font-size="10" text-anchor="end" fill="#64748b">64 GB</text>

      <!-- X Grid -->
      <line x1="40" y1="0" x2="40" y2="240" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="120" y1="0" x2="120" y2="240" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="220" y1="0" x2="220" y2="240" stroke="#e2e8f0" stroke-width="1"/>
      <line x1="310" y1="0" x2="310" y2="240" stroke="#e2e8f0" stroke-width="1"/>

      <text x="40" y="258" font-family="sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">1 GB</text>
      <text x="120" y="258" font-family="sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">10 GB</text>
      <text x="220" y="258" font-family="sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">50 GB</text>
      <text x="310" y="258" font-family="sans-serif" font-size="10.5" text-anchor="middle" fill="#334155">100 GB+</text>

      <!-- Curves -->
      <!-- Spring: 4 GB (y=84) -> 18 GB (y=44) -> 48 GB (y=18) -> 64 GB (y=0) -->
      <path d="M 40 84 L 120 44 L 220 18 L 310 0" fill="none" stroke="#dc2626" stroke-width="2.8"/>
      <polygon points="40,80 44,88 36,88" fill="#dc2626"/>
      <polygon points="120,40 124,48 116,48" fill="#dc2626"/>
      <polygon points="220,14 224,22 216,22" fill="#dc2626"/>
      <polygon points="310,-4 314,4 306,4" fill="#dc2626"/>

      <!-- Genozip: 0.5 GB (y=138) -> 2 GB (y=102) -> 6 GB (y=74) -> 8 GB (y=66) -->
      <path d="M 40 138 L 120 102 L 220 74 L 310 66" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3"/>
      <polygon points="40,134 44,138 40,142 36,138" fill="#d97706"/>
      <polygon points="120,98 124,102 120,106 116,102" fill="#d97706"/>
      <polygon points="220,70 224,74 220,78 216,74" fill="#d97706"/>
      <polygon points="310,62 314,66 310,70 306,66" fill="#d97706"/>

      <!-- GQZip: Flat 38 MB line (y=206) -->
      <line x1="40" y1="206" x2="310" y2="206" stroke="#059669" stroke-width="3.5"/>
      <circle cx="40" cy="206" r="4.5" fill="#065f46"/>
      <circle cx="120" cy="206" r="4.5" fill="#065f46"/>
      <circle cx="220" cy="206" r="4.5" fill="#065f46"/>
      <circle cx="310" cy="206" r="4.5" fill="#065f46"/>

      <!-- Legend inside Box -->
      <g transform="translate(10, 10)">
        <rect width="195" height="58" rx="4" fill="#ffffff" fill-opacity="0.92" stroke="#cbd5e1"/>
        <line x1="10" y1="14" x2="28" y2="14" stroke="#dc2626" stroke-width="2.5"/>
        <text x="34" y="17" font-family="sans-serif" font-size="9" font-weight="700" fill="#991b1b">Spring (&gt;64 GB OOM Failure)</text>

        <line x1="10" y1="29" x2="28" y2="29" stroke="#d97706" stroke-width="2" stroke-dasharray="4,3"/>
        <text x="34" y="32" font-family="sans-serif" font-size="9" fill="#92400e">Genozip (Requires Ref)</text>

        <line x1="10" y1="44" x2="28" y2="44" stroke="#059669" stroke-width="3"/>
        <text x="34" y="47" font-family="sans-serif" font-size="9" font-weight="800" fill="#065f46">GQZip (&lt;50 MB Constant RSS)</text>
      </g>
    </g>
  </g>
</svg>

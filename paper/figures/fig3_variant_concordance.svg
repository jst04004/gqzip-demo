<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="100%" height="100%">
  <rect width="900" height="520" fill="#ffffff"/>

  <text x="450" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">
    Figure 3: Downstream Biological Variant Calling Concordance on NIST GIAB NA12878
  </text>

  <g transform="translate(80, 70)">
    <rect width="760" height="380" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Y Grid: Exact 3-decimal intervals from 0.980 to 1.000 -->
    <line x1="0" y1="380" x2="760" y2="380" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="285" x2="760" y2="285" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="190" x2="760" y2="190" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="95" x2="760" y2="95" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="0" x2="760" y2="0" stroke="#e2e8f0" stroke-width="1"/>

    <text x="-15" y="385" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">0.980</text>
    <text x="-15" y="290" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">0.985</text>
    <text x="-15" y="195" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">0.990</text>
    <text x="-15" y="100" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">0.995</text>
    <text x="-15" y="5" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">1.000</text>

    <!-- X Grid: 15x, 30x, 60x -->
    <line x1="150" y1="0" x2="150" y2="380" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="450" y1="0" x2="450" y2="380" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="380" stroke="#e2e8f0" stroke-width="1"/>

    <text x="150" y="405" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">15x Depth</text>
    <text x="450" y="405" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">30x Depth (Clinical Standard)</text>
    <text x="700" y="405" font-family="sans-serif" font-size="12" font-weight="700" text-anchor="middle" fill="#334155">60x Depth (Deep WGS)</text>

    <text x="-45" y="190" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a" transform="rotate(-90 -45 190)">
      Variant Calling F1 Concordance Score
    </text>

    <!-- Curves -->
    <line x1="150" y1="0" x2="700" y2="0" stroke="#10b981" stroke-width="3.5"/>
    <circle cx="150" cy="0" r="5" fill="#10b981"/>
    <circle cx="450" cy="0" r="5" fill="#10b981"/>
    <circle cx="700" cy="0" r="5" fill="#10b981"/>
    <text x="710" y="15" font-family="sans-serif" font-size="11" font-weight="700" fill="#065f46">GQZip Lossless (F1 = 1.000)</text>

    <path d="M 150 38 Q 450 10 700 0" fill="none" stroke="#2563eb" stroke-width="3"/>
    <circle cx="150" cy="38" r="6" fill="#2563eb"/>
    <circle cx="450" cy="9.5" r="6" fill="#2563eb"/>
    <circle cx="700" cy="0" r="6" fill="#2563eb"/>
    <text x="460" y="30" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e3a8a">GQZip Adaptive SNVs (F1 = 0.9995 - 1.000)</text>

    <path d="M 150 167 Q 450 28 700 0" fill="none" stroke="#2563eb" stroke-width="2.5" stroke-dasharray="5,4"/>
    <circle cx="150" cy="167" r="5" fill="#2563eb"/>
    <circle cx="450" cy="28.5" r="5" fill="#2563eb"/>
    <text x="310" y="110" font-family="sans-serif" font-size="11" font-weight="700" fill="#2563eb">GQZip Adaptive Indels (F1 = 0.9985)</text>

    <path d="M 150 285 Q 450 114 700 38" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,4"/>
    <circle cx="150" cy="285" r="5" fill="#94a3b8"/>
    <circle cx="450" cy="114" r="5" fill="#94a3b8"/>
    <circle cx="700" cy="38" r="5" fill="#94a3b8"/>
    <text x="560" y="85" font-family="sans-serif" font-size="11" fill="#64748b">Illumina 8-bin Static Heuristic (Indel Bias)</text>
  </g>
</svg>

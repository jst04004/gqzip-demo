<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 540" width="100%" height="100%">
  <rect width="900" height="540" fill="#ffffff"/>

  <text x="450" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">
    Figure 4: Computational Memory Scalability (Peak RAM vs. FASTQ Dataset Size - Log Scale)
  </text>

  <g transform="translate(90, 70)">
    <rect width="750" height="400" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>

    <line x1="0" y1="340" x2="750" y2="340" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="255" x2="750" y2="255" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="170" x2="750" y2="170" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="85" x2="750" y2="85" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="0" x2="750" y2="0" stroke="#e2e8f0" stroke-width="1"/>

    <text x="-15" y="345" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">10 MB</text>
    <text x="-15" y="260" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">100 MB</text>
    <text x="-15" y="175" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">1 GB</text>
    <text x="-15" y="90" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">10 GB</text>
    <text x="-15" y="5" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">100 GB</text>

    <line x1="75" y1="0" x2="75" y2="400" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="250" y1="0" x2="250" y2="400" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="500" y1="0" x2="500" y2="400" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="700" y1="0" x2="700" y2="400" stroke="#e2e8f0" stroke-width="1"/>

    <text x="75" y="420" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#64748b">1 GB</text>
    <text x="250" y="420" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#64748b">10 GB</text>
    <text x="500" y="420" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#64748b">50 GB (NovaSeq)</text>
    <text x="700" y="420" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#64748b">100 GB+</text>

    <text x="-50" y="200" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a" transform="rotate(-90 -50 200)">
      Peak Resident Memory Footprint (Log Scale)
    </text>

    <!-- Spring curve with OOM label -->
    <path d="M 75 118 L 250 63 L 500 27 L 700 16" fill="none" stroke="#ef4444" stroke-width="3"/>
    <circle cx="75" cy="118" r="5" fill="#ef4444"/>
    <circle cx="250" cy="63" r="5" fill="#ef4444"/>
    <circle cx="500" cy="27" r="5" fill="#ef4444"/>
    <circle cx="700" cy="16" r="5" fill="#ef4444"/>
    <text x="520" y="18" font-family="sans-serif" font-size="11" font-weight="700" fill="#dc2626">Spring (&gt; 64 GB OOM Threshold)</text>

    <!-- Genozip curve -->
    <path d="M 75 195 L 250 144 L 500 104 L 700 93" fill="none" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="5,4"/>
    <circle cx="75" cy="195" r="4.5" fill="#f59e0b"/>
    <circle cx="250" cy="144" r="4.5" fill="#f59e0b"/>
    <circle cx="500" cy="104" r="4.5" fill="#f59e0b"/>
    <circle cx="700" cy="93" r="4.5" fill="#f59e0b"/>
    <text x="690" y="80" font-family="sans-serif" font-size="11" font-weight="700" fill="#b45309" text-anchor="end">Genozip (Needs Reference Index)</text>

    <!-- GQZip: Single definitive label -->
    <line x1="75" y1="290" x2="700" y2="290" stroke="#10b981" stroke-width="4"/>
    <circle cx="75" cy="290" r="6" fill="#065f46"/>
    <circle cx="250" cy="290" r="6" fill="#065f46"/>
    <circle cx="500" cy="290" r="6" fill="#065f46"/>
    <circle cx="700" cy="290" r="6" fill="#065f46"/>
    <text x="385" y="275" font-family="sans-serif" font-size="12" font-weight="800" text-anchor="middle" fill="#065f46">
      ★ GQZip: Constant &lt; 50 MB RSS Ceiling
    </text>
  </g>
</svg>

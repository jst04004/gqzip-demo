<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="100%" height="100%">
  <rect width="900" height="560" fill="#ffffff"/>

  <text x="450" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" text-anchor="middle" fill="#0f172a">
    Figure 2: Multi-Codec Pareto Space (Quantized Frontier vs. Lossless Envelope)
  </text>

  <!-- Plot Area -->
  <g transform="translate(80, 70)">
    <!-- Axes Grid -->
    <rect width="760" height="420" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
    
    <!-- Horizontal Grid Lines (Ratio 0x to 16x) -->
    <line x1="0" y1="420" x2="760" y2="420" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="341" x2="760" y2="341" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="262" x2="760" y2="262" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="184" x2="760" y2="184" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="105" x2="760" y2="105" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="0" y1="26" x2="760" y2="26" stroke="#e2e8f0" stroke-width="1"/>

    <!-- Y-Axis Labels -->
    <text x="-15" y="425" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">0x</text>
    <text x="-15" y="346" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">3x</text>
    <text x="-15" y="267" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">6x</text>
    <text x="-15" y="189" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">9x</text>
    <text x="-15" y="110" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">12x</text>
    <text x="-15" y="31" font-family="sans-serif" font-size="11" text-anchor="end" fill="#64748b">15x</text>

    <!-- X-Axis Grid & Labels (0 to 600 MB/s) -->
    <line x1="0" y1="0" x2="0" y2="420" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="152" y1="0" x2="152" y2="420" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="304" y1="0" x2="304" y2="420" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="456" y1="0" x2="456" y2="420" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="608" y1="0" x2="608" y2="420" stroke="#e2e8f0" stroke-width="1"/>
    <line x1="760" y1="0" x2="760" y2="420" stroke="#e2e8f0" stroke-width="1"/>

    <text x="0" y="440" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#64748b">0</text>
    <text x="152" y="440" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#64748b">100</text>
    <text x="304" y="440" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#64748b">200</text>
    <text x="456" y="440" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#64748b">300</text>
    <text x="608" y="440" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#64748b">400</text>
    <text x="760" y="440" font-family="sans-serif" font-size="11" text-anchor="middle" fill="#64748b">500 MB/s</text>

    <!-- Axis Titles -->
    <text x="-45" y="210" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a" transform="rotate(-90 -45 210)">
      Compression Ratio (X)
    </text>
    <text x="380" y="470" font-family="sans-serif" font-size="13" font-weight="700" text-anchor="middle" fill="#0f172a">
      Decompression Throughput Speed (MB/s)
    </text>

    <!-- 1. Quantized Frontier Curve (Solid Blue Line) -->
    <path d="M 623 247 L 730 58" fill="none" stroke="#2563eb" stroke-width="3.5"/>
    <text x="715" y="100" font-family="sans-serif" font-size="12" font-weight="800" fill="#2563eb">★ Quantized Frontier (GQZip Dominant)</text>

    <!-- 2. Lossless Envelope Curve (Dashed Slate Line) -->
    <path d="M 68 184 L 212 263 L 681 286" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="220" y="295" font-family="sans-serif" font-size="11" font-weight="700" fill="#64748b">Lossless Envelope (Spring / Genozip / zstd)</text>

    <!-- Competitor Points -->
    <circle cx="588" cy="306" r="6" fill="#94a3b8" stroke="#475569" stroke-width="1.5"/>
    <text x="596" y="310" font-family="sans-serif" font-size="11" fill="#334155">gzip -9 (4.33x)</text>

    <circle cx="681" cy="286" r="6" fill="#475569" stroke="#1e293b" stroke-width="2"/>
    <text x="689" y="280" font-family="sans-serif" font-size="11" font-weight="700" fill="#1e293b">zstd -19 (5.08x)</text>

    <circle cx="68" cy="184" r="7" fill="#ef4444" stroke="#991b1b" stroke-width="2"/>
    <text x="78" y="180" font-family="sans-serif" font-size="11" font-weight="700" fill="#991b1b">Spring (8.98x)</text>

    <circle cx="212" cy="263" r="6.5" fill="#f59e0b" stroke="#b45309" stroke-width="2"/>
    <text x="220" y="255" font-family="sans-serif" font-size="11" font-weight="700" fill="#b45309">Genozip (5.98x)</text>

    <circle cx="547" cy="207" r="6" fill="#94a3b8" stroke="#64748b" stroke-width="1.5"/>
    <text x="555" y="215" font-family="sans-serif" font-size="11" fill="#64748b">Illumina 8-bin (8.11x)</text>

    <!-- GQZip Points -->
    <circle cx="486" cy="333" r="7.5" fill="#10b981" stroke="#065f46" stroke-width="2"/>
    <text x="496" y="348" font-family="sans-serif" font-size="11" font-weight="700" fill="#065f46">GQZip Lossless (3.33x, &lt;50MB RAM)</text>

    <circle cx="623" cy="247" r="9" fill="#2563eb" stroke="#1e3a8a" stroke-width="2.5"/>
    <text x="635" y="245" font-family="sans-serif" font-size="12" font-weight="800" fill="#1e3a8a">GQZip Adaptive (6.58x, 410 MB/s)</text>

    <circle cx="730" cy="58" r="9" fill="#9333ea" stroke="#581c87" stroke-width="2.5"/>
    <text x="720" y="45" font-family="sans-serif" font-size="12" font-weight="800" fill="#581c87" text-anchor="end">GQZip Binary 2-bin (13.81x, 480 MB/s)</text>
  </g>
</svg>
